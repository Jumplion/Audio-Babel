name: Lint

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  clang-format:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Apply formatting
        run: |
          find cpp -regextype posix-extended -regex '.*\.(cpp|h|hpp)' -print0 \
            | xargs -0 clang-format -i

      - name: Commit formatting fixes
        if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "style: apply clang-format"
          file_pattern: "cpp/**/*.cpp cpp/**/*.h cpp/**/*.hpp"

  clang-tidy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Boost headers
        run: sudo apt-get update && sudo apt-get install -y libboost-dev

      - name: Configure CMake
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug -DCMAKE_EXPORT_COMPILE_COMMANDS=ON

      - name: Run clang-tidy
        run: find cpp/src -name '*.cpp' -print0 | xargs -0 clang-tidy -p build
