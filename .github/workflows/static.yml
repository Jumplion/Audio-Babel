# Workflow for deploying static content to GitHub Pages
name: Deploy static content to Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["main"]
    paths:
      - 'docs/**'
      - '.github/workflows/static.yml'

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

  # WASM Build's auto-commit uses GITHUB_TOKEN, which GitHub Actions
  # deliberately excludes from triggering the push event above (anti-recursion
  # protection) -- so a WASM-only rebuild would otherwise never redeploy.
  workflow_run:
    workflows: ["WASM Build"]
    types: [completed]
    branches: ["main"]

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Single deploy job since we're just deploying
  deploy:
    # For workflow_run, only proceed if WASM Build actually succeeded --
    # otherwise this would also fire (and deploy stale content) on failure.
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Verify WASM files exist
        run: |
          echo "Checking for required WASM files..."
          if [ ! -f "docs/wasm/index.wasm" ]; then
            echo "ERROR: docs/wasm/index.wasm not found!"
            exit 1
          fi
          if [ ! -f "docs/wasm/index.js" ]; then
            echo "ERROR: docs/wasm/index.js not found!"
            exit 1
          fi
          echo "✓ WASM files found"
          echo "  index.wasm: $(stat -c%s docs/wasm/index.wasm) bytes"
          echo "  index.js: $(stat -c%s docs/wasm/index.js) bytes"
      
      - name: Verify .nojekyll exists
        run: |
          if [ ! -f "docs/.nojekyll" ]; then
            echo "WARNING: docs/.nojekyll not found. Creating it..."
            touch docs/.nojekyll
          else
            echo "✓ .nojekyll file exists"
          fi
      
      - name: List docs directory structure
        run: |
          echo "Contents of docs/ directory:"
          ls -lah docs/
          echo ""
          echo "Contents of docs/wasm/ directory:"
          ls -lah docs/wasm/
      
      - name: Setup Pages
        uses: actions/configure-pages@v5
      
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Upload docs directory only (contains the static site)
          path: 'docs'
      
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
      
      - name: Summary
        run: |
          echo "## Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "✅ Successfully deployed to GitHub Pages" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Site URL:** ${{ steps.deployment.outputs.page_url }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Deployed Files" >> $GITHUB_STEP_SUMMARY
          echo "- Static site from \`docs/\` directory" >> $GITHUB_STEP_SUMMARY
          echo "- WASM module: \`index.wasm\`" >> $GITHUB_STEP_SUMMARY
          echo "- WASM glue code: \`index.js\`" >> $GITHUB_STEP_SUMMARY
