name: WASM Build

on:
  push:
    branches: ["main"]
    paths:
      - "cpp/**"
      - ".github/workflows/wasm-build.yml"
  pull_request:
    branches: ["main"]
    paths:
      - "cpp/**"
      - ".github/workflows/wasm-build.yml"

jobs:
  build-wasm:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Setup Emscripten
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: 3.1.74

      - name: Install Boost headers for Emscripten
        run: embuilder build boost_headers

      - name: Build WASM module
        run: ./build-wasm.sh
        working-directory: cpp/wasm

      - name: Verify WASM output
        run: |
          ls -lh docs/wasm/index.wasm docs/wasm/index.js

      - name: Commit WASM build
        if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: update WASM binary"
          file_pattern: "docs/wasm/index.wasm docs/wasm/index.js"

      - name: Upload WASM artifacts
        uses: actions/upload-artifact@v4
        with:
          name: wasm-build
          path: |
            docs/wasm/index.wasm
            docs/wasm/index.js
