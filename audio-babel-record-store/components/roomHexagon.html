<!DOCTYPE html>

<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../css/room.css">
    <title>Room Hexagon</title>
</head>
<body>
    <div class="room-hexagon">

    <script src="../js/roomRenderer.js"></script>

</html>
