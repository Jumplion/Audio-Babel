<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Audio Babel — Record</title>
    <!--
      NOTE: This page is disabled and sequestered from the live site (see README.md
      in this directory). Stylesheet/script paths below point back at the active
      docs/ assets this page depends on; record.css and recorder.js live alongside
      this file.
    -->
    <link rel="stylesheet" href="../../docs/css/site.css" />
    <link rel="stylesheet" href="../../docs/css/result.css" />
    <link rel="stylesheet" href="./record.css" />
</head>

<body class="record">
    <div id="navContainer"></div>

    <div class="wrap">
        <main class="card">
            <h1>Record</h1>
            <p>
                <small>Record audio from your microphone and extract the index.</small>
            </p>

            <div class="record-controls">
                <button class="btn" id="recordStartStop">Start Recording</button>
                <button class="btn" id="uploadRecording" disabled>Extract Index</button>
                <span id="recordStatus">Idle</span>
                <span id="recordDuration">00:00</span>
            </div>
            <div class="record-player-container">
                <audio id="recordPlayer" controls></audio>
            </div>

            <div id="statusLine">
                <span id="statusMsg">Ready</span><span id="statusSpinner" class="spinner"></span>
            </div>
            <div id="resultContainer"></div>
        </main>
    </div>

    <script type="module">
        import { loadFragment } from '../../docs/js/ui/loadFragment.js';
        import { highlightActiveNav } from '../../docs/js/ui/nav.js';
        import { handleJsonResponse } from '../../docs/js/core/resultDisplay.js';
        import { showValidationError, handleError } from '../../docs/js/utils/errorHandler.js';
        import { createRecorder } from './recorder.js';

        (async () => { await loadFragment('#navContainer', '../../docs/components/navbar.html'); highlightActiveNav('#navContainer'); })();

        function setLoading(on) {
            const spinner = document.getElementById('statusSpinner');
            const msg = document.getElementById('statusMsg');
            const recordStartStop = document.getElementById('recordStartStop');
            const uploadRecording = document.getElementById('uploadRecording');
            const controls = [recordStartStop, uploadRecording];
            const resultContainer = document.getElementById('resultContainer');

            if (on) {
                if (spinner) spinner.style.display = 'inline-block';
                if (msg) msg.textContent = 'Loading...';
                controls.forEach((c) => c && c.classList.add('disabled'));
                if (resultContainer) resultContainer.classList.add('skeleton');
            } else {
                if (spinner) spinner.style.display = 'none';
                if (msg) msg.textContent = 'Ready';
                controls.forEach((c) => c && c.classList.remove('disabled'));
                if (resultContainer) resultContainer.classList.remove('skeleton');
            }
        }

        const recordStartStop = document.getElementById('recordStartStop');
        const uploadRecording = document.getElementById('uploadRecording');
        const recordPlayer = document.getElementById('recordPlayer');
        const recordStatus = document.getElementById('recordStatus');
        const recordDuration = document.getElementById('recordDuration');

        const recorder = createRecorder({
            recordPlayer,
            recordStatus,
            recordDurationEl: recordDuration,
            uploadRecording,
            setLoading,
            handleJsonResponse
        });

        let recording = false;

        recordStartStop.addEventListener('click', async () => {
            try {
                if (!recording) {
                    const hasDevice = await recorder.hasInputDevice();
                    if (!hasDevice) {
                        showValidationError('No audio input devices were detected. Please plug in or enable a microphone and try again.');
                        return;
                    }
                    await recorder.startRecording();
                    recording = true;
                    recordStartStop.textContent = 'Stop Recording';
                } else {
                    recorder.stopRecording();
                    recording = false;
                    recordStartStop.textContent = 'Start Recording';
                }
            } catch (e) {
                handleError('record.html:recordStartStop', e, 'Recording failed: ' + e.message);
            }
        });

        uploadRecording.addEventListener('click', async () => {
            try {
                await recorder.uploadRecorded();
            } catch (e) {
                handleError('record.html:uploadRecording', e, 'Upload failed: ' + e.message);
            }
        });
    </script>
</body>

</html>
