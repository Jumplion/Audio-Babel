<!DOCTYPE html>
<html lang="en">

<head>
    <base href="/Audio-Babel/" />
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Audio Babel — Browse</title>
    <link rel="stylesheet" href="./css/site.css" />
    <link rel="stylesheet" href="./css/browse.css" />
    <link rel="stylesheet" href="./css/resultHandler.css" />
</head>

<body class="browse">
    <div id="navContainer"></div>

    <div class="wrap">
        <main class="card">
            <h1>Browse the Record Shop</h1>
            
            <p class="browse-intro">
                Navigate through the infinite Record Shop. Each room contains 4 walls (genres), 
                each wall has 5 shelves (artists), each shelf holds 32 albums, and each album has 15 tracks.
            </p>

            <nav id="breadcrumb" aria-label="Breadcrumb"></nav>

            <!-- Room Selection -->
            <section id="roomSection" class="nav-section">
                <h2>Enter a Room</h2>
                <div class="input-row">
                    <label for="roomInput">Room Number:</label>
                    <input type="text" id="roomInput" placeholder="0" maxlength="100" />
                    <button class="btn" id="enterRoomBtn">Enter</button>
                </div>
            </section>

            <!-- Wall Selection (Hexagon) -->
            <section id="wallSection" class="nav-section" style="display: none;">
                <h2>Select a Wall</h2>
                <div id="hexagonContainer" class="hexagon-container">
                    <svg viewBox="0 0 220 220" class="hexagon-svg">
                        <!-- Full hexagon outline -->
                        <polygon class="hexagon-outline" points="110,20 190,65 190,155 110,200 30,155 30,65" />
                        
                        <!-- Inner hexagon for segment boundaries (scaled to 55% = thinner trapezoids) -->
                        <!-- Original: 110,70 150,90 150,130 110,150 70,130 70,90 -->
                        <!-- Scaled 55%: inner radius ~44 units from center -->
                        <polygon class="hexagon-inner" points="110,55 165,80 165,140 110,165 55,140 55,80" />
                        
                        <!-- 6 trapezoid segments (thinner with larger inner hexagon) -->
                        <g id="wallGroup">
                            <!-- Top segment (Wall 0 - Blue) -->
                            <polygon class="wall segment" data-wall="0" 
                                points="110,20 190,65 165,80 110,55 55,80 30,65" />
                            
                            <!-- Top-right segment (non-selectable) -->
                            <polygon class="segment segment-disabled" 
                                points="190,65 190,155 165,140 165,80" />
                            
                            <!-- Bottom-right segment (Wall 1 - Green) -->
                            <polygon class="wall segment" data-wall="1" 
                                points="190,155 110,200 110,165 165,140" />
                            
                            <!-- Bottom segment (Wall 2 - Orange) -->
                            <polygon class="wall segment" data-wall="2" 
                                points="110,200 30,155 55,140 110,165" />
                            
                            <!-- Bottom-left segment (non-selectable) -->
                            <polygon class="segment segment-disabled" 
                                points="30,155 30,65 55,80 55,140" />
                            
                            <!-- Top-left segment (Wall 3 - Purple) -->
                            <polygon class="wall segment" data-wall="3" 
                                points="30,65 110,20 110,55 55,80" />
                        </g>
                    </svg>
                </div>
            </section>

            <!-- Shelf Selection -->
            <section id="shelfSection" class="nav-section" style="display: none;">
                <h2>Select a Shelf</h2>
                <div id="shelvesContainer" class="shelves-container">
                    <!-- 5 shelves will be generated here -->
                </div>
            </section>

            <!-- Album Selection -->
            <section id="albumSection" class="nav-section" style="display: none;">
                <h2>Select an Album</h2>
                <div id="albumsContainer" class="albums-container">
                    <!-- 32 albums will be generated here -->
                </div>
            </section>

            <!-- Track Selection -->
            <section id="trackSection" class="nav-section" style="display: none;">
                <h2>Select a Track</h2>
                <div id="tracksContainer" class="tracks-container">
                    <!-- 15 tracks will be generated here -->
                </div>
            </section>

            <!-- Result Display -->
            <section id="resultSection" class="nav-section" style="display: none;">
                <h2>Track Details</h2>
                <div id="resultContainer"></div>
            </section>

        </main>
    </div>

    <!-- IMPORTANT: main.js must load FIRST to enable client-side API before browse.js makes fetch calls -->
    <script type="module" src="./js/pages/main.js?v=5"></script>
    <script type="module" src="./js/pages/browse.js?v=5"></script>
    <script type="module">
        import { loadFragment } from './js/ui/loadFragment.js';
        import { highlightActiveNav } from './js/ui/nav.js';
        (async () => { await loadFragment('#navContainer', './components/navbar.html'); highlightActiveNav('#navContainer'); })();
    </script>

</body>
