<section id="result">
  <h3>Index</h3>
  <pre id="indexDisplay"></pre>
  
  <div id="positionInfo" style="margin: 16px 0; padding: 12px; background: rgba(30, 36, 51, 0.4); border: 1px solid rgba(100, 120, 200, 0.3); border-radius: 8px;">
    <strong>Position in Library:</strong>
    <div style="margin-top: 8px; font-family: 'Courier New', monospace;">
      <span id="positionDisplay">Calculating...</span>
    </div>
  </div>
  
  <div id="metadata">
    <img id="coverImg" src="data:image/gif;base64,R0lGODlhAQABAAD/ACwAAAAAAQABAAACADs=" alt="cover" />
    <div class="metadata-content">
      <div class="meta-field meta-genre"><strong>Genre:</strong> <span id="metaGenre"></span></div>
      <div class="meta-field meta-artist"><strong>Artist:</strong> <span id="metaArtist"></span></div>
      <div class="meta-field meta-album"><strong>Album:</strong> <span id="metaAlbum"></span></div>
      <div class="meta-field meta-track"><strong>Track:</strong> <span id="metaTrack"></span></div>
    </div>
    <div class="metadata-clearfix"></div>
  </div>
  <h3>Audio</h3>
  <div id="waveformContainer"></div>
  <div class="audio-actions">
    <div class="play-row" style="margin-top: 12px; display: flex; gap: 8px; align-items: center;">
      <button id="playPauseBtn" class="btn" style="min-width: 100px;">▶ Play</button>
      <sub>Utilizing <a href="https://wavesurfer.xyz/" target="_blank" rel="noopener">WaveSurfer.js</a> for waveform visualization and playback</sub>
    </div>

    <div class="download-row" style="margin-top: 16px;">
      <button class="btn"><a id="downloadLink" href="#" download="reconstructed.wav">Download WAV</a></button>
    </div>
  </div>
</section>
