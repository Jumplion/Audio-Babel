<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Audio Babel — Record</title>
    <link rel="stylesheet" href="./css/site.css" />
    <link rel="stylesheet" href="./css/resultHandler.css" />
    <link rel="stylesheet" href="./css/record.css" />
</head>

<body class="record">
    <div id="navContainer"></div>

    <div class="wrap">
        <main class="card">
            <h1>Record</h1>
            <p>
                <small>Record audio from your microphone and extract the index.</small>
            </p>
            <div class="record-controls">
                <button class="btn" id="recordStartStop">Start Recording</button>
                <button class="btn" id="uploadRecording" disabled>Extract</button>
                <span id="recordStatus">Idle</span>
                <span id="recordDuration">00:00</span>
            </div>
            <div class="record-player-container">
                <audio id="recordPlayer" controls></audio>
            </div>

            <div id="statusLine">
                <span id="statusMsg">Ready</span><span id="statusSpinner" class="spinner"></span>
            </div>
            <div id="resultContainer"></div>
        </main>
    </div>

    <script type="module" src="./js/main.js?v=4"></script>
    <script type="module">
        import { loadFragment } from './js/loadFragment.js';
        import { highlightActiveNav } from './js/nav.js';
        (async () => { await loadFragment('#navContainer', './components/navbar.html'); highlightActiveNav('#navContainer'); })();
    </script>
</body>

</html>
