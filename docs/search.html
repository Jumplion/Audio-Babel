<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Audio Babel — Search</title>
    <link rel="stylesheet" href="./css/site.css" />
    <link rel="stylesheet" href="./css/resultHandler.css" />
    <link rel="stylesheet" href="./css/search.css" />
</head>

<body class="search">
    <div id="navContainer"></div>

    <div class="wrap">
        <main class="card">
            <h1>Search Index</h1>
            <div class="search-container">
                <label for="searchInput">Enter an index string (A-Z, a-z, 0-9, - and _):</label>
                <textarea id="searchInput" rows="1" placeholder="Type index here..."></textarea>
                
                <div class="search-actions">
                    <button class="btn" id="doSearchGenerate" disabled>Generate from index</button>
                </div>
                <p class="search-help">
                    <small>Only characters A-Z a-z 0-9 - and _ are allowed. 3 symbols per sample.</small>
                </p>
            </div>

            <div id="statusLine">
                <span id="statusMsg">Ready</span><span id="statusSpinner" class="spinner"></span>
            </div>
            <div id="resultContainer"></div>

            <footer>
                <small>Search anindex string and reconstruct audio.</small>
            </footer>
        </main>
    </div>

    <script type="module" src="./js/main.js?v=4"></script>
    <script type="module">
        import { loadFragment } from './js/loadFragment.js';
        import { highlightActiveNav } from './js/nav.js';
        (async () => { await loadFragment('#navContainer', './components/navbar.html'); highlightActiveNav('#navContainer'); })();
    </script>

</body>

</html>
