<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>WASM Integration Test</title>
    <link rel="stylesheet" href="./css/site.css" />
    <style>
        .test-result {
            margin: 1rem 0;
            padding: 1rem;
            border-radius: 8px;
            font-family: monospace;
        }
        .test-pass {
            background: rgba(76, 175, 80, 0.2);
            border: 1px solid #4caf50;
            color: #4caf50;
        }
        .test-fail {
            background: rgba(244, 67, 54, 0.2);
            border: 1px solid #f44336;
            color: #f44336;
        }
        .test-pending {
            background: rgba(255, 193, 7, 0.2);
            border: 1px solid #ffc107;
            color: #ffc107;
        }
    </style>
</head>

<body>
    <div class="wrap">
        <main class="card">
            <h1>WASM Integration Test</h1>
            <p>This page tests the WebAssembly module integration for sample-based audio indexing.</p>

            <button class="btn" id="runTests">Run All Tests</button>

            <div id="testResults"></div>
        </main>
    </div>

    <script type="module">
        import AudioIndexWASM from './js/audioIndexWasm.js';

        const resultsContainer = document.getElementById('testResults');
        const runTestsBtn = document.getElementById('runTests');

        function addResult(testName, passed, message) {
            const div = document.createElement('div');
            div.className = `test-result ${passed ? 'test-pass' : 'test-fail'}`;
            div.innerHTML = `<strong>${passed ? '✓' : '✗'} ${testName}</strong><br>${message}`;
            resultsContainer.appendChild(div);
        }

        function addPending(testName, message) {
            const div = document.createElement('div');
            div.className = 'test-result test-pending';
            div.innerHTML = `<strong>⏳ ${testName}</strong><br>${message}`;
            div.id = testName.replace(/\s+/g, '-');
            resultsContainer.appendChild(div);
            return div;
        }

        async function runTests() {
            resultsContainer.innerHTML = '';
            
            try {
                // Test 1: WASM Module Initialization
                const pendingInit = addPending('WASM Initialization', 'Loading WebAssembly module...');
                const wasm = new AudioIndexWASM();
                await wasm.initialize();
                pendingInit.remove();
                addResult('WASM Initialization', true, 'Module loaded successfully');

                // Test 2: Sample-Based Format - Encoding Simple Samples
                const pendingSampleEncode = addPending('Sample-Based - Encode', 'Encoding test samples...');
                const testSamples = new Uint8Array([
                    0x00, 0x00,  // Sample 0
                    0xFF, 0xFF,  // Sample 65535 (max)
                    0x00, 0x80,  // Sample 32768 (mid)
                ]);
                const sampleBase64 = wasm.encodeToSampleBase64(testSamples);
                pendingSampleEncode.remove();
                const expectedLength = 9; // 3 samples * 3 chars each
                addResult('Sample-Based - Encode', 
                    sampleBase64.length === expectedLength,
                    `Encoded ${testSamples.length / 2} samples to ${sampleBase64.length} chars (expected ${expectedLength})`);

                // Test 3: Sample-Based Format - Decoding
                const pendingSampleDecode = addPending('Sample-Based - Decode', 'Decoding test samples...');
                const decodedSamples = wasm.decodeFromSampleBase64(sampleBase64);
                pendingSampleDecode.remove();
                const samplesMatch = decodedSamples.length === testSamples.length &&
                    decodedSamples.every((val, i) => val === testSamples[i]);
                addResult('Sample-Based - Decode', samplesMatch,
                    `Decoded ${decodedSamples.length} bytes, matches original: ${samplesMatch}`);

                // Test 4: Round-trip Consistency
                const pendingRoundtrip = addPending('Round-trip Test', 'Testing encode/decode consistency...');
                const testSamples2 = new Uint8Array([0x12, 0x34, 0x56, 0x78, 0x9A, 0xBC]);
                const encoded2 = wasm.encodeToSampleBase64(testSamples2);
                const decoded2 = wasm.decodeFromSampleBase64(encoded2);
                pendingRoundtrip.remove();
                const roundtripMatch = decoded2.length === testSamples2.length &&
                    decoded2.every((val, i) => val === testSamples2[i]);
                addResult('Round-trip Test', roundtripMatch,
                    `Original ${testSamples2.length} bytes → ${encoded2.length} chars → ${decoded2.length} bytes: ${roundtripMatch ? 'PASS' : 'FAIL'}`);

                // Test 5: WAV Blob Creation
                const pendingWav = addPending('WAV Blob Creation', 'Creating WAV from samples...');
                const wavBlob = wasm.samplesToWav(testSamples, 44100, 16, 1);
                pendingWav.remove();
                const wavValid = wavBlob instanceof Blob && wavBlob.size > 44; // WAV header is 44 bytes
                addResult('WAV Blob Creation', wavValid,
                    `Created ${wavBlob.size} byte WAV file (header + ${testSamples.length} sample bytes)`);

                // Test 6: Larger Sample Set
                const pendingLarge = addPending('Large Sample Test', 'Testing with 441 samples (0.01s at 44.1kHz)...');
                const largeSamples = new Uint8Array(882); // 441 samples * 2 bytes
                for (let i = 0; i < 441; i++) {
                    const value = Math.floor(Math.random() * 65536);
                    largeSamples[i * 2] = value & 0xFF;
                    largeSamples[i * 2 + 1] = (value >> 8) & 0xFF;
                }
                const largeEncoded = wasm.encodeToSampleBase64(largeSamples);
                const largeDecoded = wasm.decodeFromSampleBase64(largeEncoded);
                pendingLarge.remove();
                const largeMatch = largeDecoded.length === largeSamples.length &&
                    largeDecoded.every((val, i) => val === largeSamples[i]);
                addResult('Large Sample Test', largeMatch,
                    `Encoded ${largeSamples.length} bytes to ${largeEncoded.length} chars, decoded successfully: ${largeMatch}`);

                // Test 7: Index Validation
                const pendingValidation = addPending('Index Validation', 'Testing index validation...');
                const validIndex = 'ABCabc012-_'; // Valid base64url characters
                const invalidIndex = 'ABC+/='; // Invalid characters for URL-safe base64
                const isValid = wasm.validateIndex(validIndex);
                const isInvalid = !wasm.validateIndex(invalidIndex);
                pendingValidation.remove();
                addResult('Index Validation', isValid && isInvalid,
                    `Valid index: ${isValid}, Invalid index rejected: ${isInvalid}`);

                // Test 8: Calculate Base64 Size
                const pendingCalc = addPending('Size Calculation', 'Testing base64 size calculation...');
                const duration = 1.0; // 1 second
                const sampleRate = 44100;
                const channels = 1;
                const expectedSize = duration * sampleRate * channels * 3; // 3 chars per sample
                const calculatedSize = wasm.calculateSampleBase64Size(duration, sampleRate, channels);
                pendingCalc.remove();
                addResult('Size Calculation', calculatedSize === expectedSize,
                    `${duration}s at ${sampleRate}Hz: ${calculatedSize} chars (expected ${expectedSize})`);

                // Test 9: Audio Element Creation
                const pendingAudio = addPending('Audio Element', 'Creating audio element...');
                const audioElement = wasm.createAudioElement(testSamples, 44100, 16);
                pendingAudio.remove();
                const audioValid = audioElement instanceof HTMLAudioElement && audioElement.src.length > 0;
                addResult('Audio Element', audioValid,
                    `Created audio element with ${audioElement.src.length} char data URL`);

                // Test 10: Empty Input Handling
                const pendingEmpty = addPending('Empty Input', 'Testing empty input handling...');
                try {
                    const emptyEncoded = wasm.encodeToSampleBase64(new Uint8Array(0));
                    pendingEmpty.remove();
                    addResult('Empty Input', emptyEncoded.length === 0,
                        `Empty input produces empty output: ${emptyEncoded.length === 0 ? 'PASS' : 'FAIL'}`);
                } catch (error) {
                    pendingEmpty.remove();
                    addResult('Empty Input', false, `Error handling empty input: ${error.message}`);
                }

                // Summary
                addResult('All Tests Complete', true, 
                    'WebAssembly integration is working correctly! Sample-based format ready for production use.');

            } catch (error) {
                addResult('Test Failed', false, `Error: ${error.message}\n\nStack: ${error.stack}`);
            }
        }

        runTestsBtn.addEventListener('click', runTests);

        // Auto-run tests on page load
        window.addEventListener('DOMContentLoaded', () => {
            setTimeout(runTests, 500);
        });
    </script>
</body>

</html>
