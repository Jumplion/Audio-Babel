<div id="sotb-player" class="sotb-player" aria-live="polite">
  <div class="sotb-player-inner">
    <div class="sotb-controls-left">
      <button id="sotb-prev" class="sotb-btn" title="Previous track">⏮</button>
      <button id="sotb-play" class="sotb-btn" title="Play/Pause">▶</button>
      <button id="sotb-next" class="sotb-btn" title="Next track">⏭</button>
    </div>

    <div class="sotb-track">
      <div id="sotb-track-title" class="sotb-track-title">No track</div>
      <div id="sotb-track-meta" class="sotb-track-meta"></div>
    </div>

    <div class="sotb-controls-right">
      <button id="sotb-playlist-toggle" class="sotb-btn" title="Show playlist">
        ☰ Playlist
      </button>
      <button id="sotb-add" class="sotb-btn" title="Add current index to playlist">
        ＋ Add
      </button>
      <div id="sotb-progress" class="sotb-progress" role="progressbar" aria-valuemin="0" aria-valuemax="100"
        aria-valuenow="0">
        <div id="sotb-progress-bar" class="sotb-progress-bar"></div>
      </div>
      <div id="sotb-time" class="sotb-time">0:00</div>
    </div>
  </div>
  <audio id="sotb-audio" preload="metadata"></audio>
</div>

<!-- Playlist drawer -->
<div id="sotb-playlist-drawer" class="sotb-playlist-drawer" aria-hidden="true">
  <div class="sotb-playlist-header">
    <strong>Playlist</strong>
    <button id="sotb-playlist-close" class="sotb-btn">Close</button>
  </div>
  <ul id="sotb-playlist" class="sotb-playlist">
    <!-- items injected here -->
  </ul>
  <div class="sotb-playlist-actions">
    <button id="sotb-clear-playlist" class="sotb-btn">Clear</button>
  </div>
</div>

<!-- Toast container for transient notifications (added by player) -->
<div id="sotb-toast-container" class="sotb-toast-container" aria-live="polite" aria-atomic="true"></div>
