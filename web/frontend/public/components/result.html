<section id="result" style="margin-top: 16px; display: none">

      background: #f6f8fa;
      border-radius: 6px;
    "></pre>

        height: 128px;
        float: left;
        margin-right: 12px;
        border-radius: 6px;
      " />

      <div><strong>Genre:</strong> <span id="metaGenre"></span></div>

  <div id="similarContainer" style="margin-top:12px; display:none">
