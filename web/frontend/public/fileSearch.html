<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Audibel — Upload .wav</title>
    <link rel="stylesheet" href="./css/site.css" />
</head>

<body class="file-search">
    <div id="navContainer"></div>

    <div class="wrap">
        <main class="card">
            <h1>Upload .wav</h1>
            <div style="margin-bottom:12px">
                <label for="fileInput">Select a .wav file to upload:</label>
                <input id="fileInput" type="file" accept="audio/wav,audio/x-wav,.wav"
                    style="display: block; margin-top: 6px" />
                <div style="margin-top: 8px">
                    <button class="btn" id="doFileSearch">Upload &amp; Extract</button>
                </div>
                <p style="margin-top: 8px">
                    <small>Uploaded files must be under server's size limit.</small>
                </p>
            </div>

            <div id="statusLine" style="margin-bottom:8px; display:flex; align-items:center; gap:8px;">
                <span id="statusMsg">Ready</span><span id="statusSpinner" style="display: none" class="spinner"></span>
            </div>
            <div id="resultContainer"></div>

            <footer>
                <small>Upload a WAV to extract an index and reconstruct.</small>
            </footer>
        </main>
    </div>

    <script type="module" src="./js/main.js?v=4"></script>
    <script type="module">
        import { loadFragment } from './js/loadFragment.js';
        import { highlightActiveNav } from './js/nav.js';
        (async () => { await loadFragment('#navContainer', './components/navbar.html'); highlightActiveNav('#navContainer'); })();
    </script>
</body>

</html>
