<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Random — Audibel</title>
    <link rel="stylesheet" href="./css/site.css" />
</head>

<body class="light">
    <div class="wrap">
        <main class="card light">
            <h1>Random</h1>
            <p>This is a temporary page for Random.</p>
            <div id="controls">
                <p>
                    <a class="btn" id="homeBtn" href="./index.html">Back to Home</a>
                </p>
                <p>
                    <label for="sizeSelect">Index size:</label>
                    <select id="sizeSelect">
                        <option value="65536">64 KB</option>
                        <option value="262144">256 KB</option>
                        <option value="524288">512 KB</option>
                        <option value="1048576">1 MB</option>
                        <option value="3145728">3 MB</option>
                        <option value="5242880">5 MB</option>
                        <option value="62914560">60 MB</option>
                    </select>
                    <button class="btn" id="regenBtn">Generate</button>
                </p>
                <p>
                    <small>Note: server limits may cap the maximum allowed size (server max = 60 MB).</small>
                </p>
            </div>

            <section id="status">
                <p id="message">
                    Click generate to create a random index and reconstruct audio.
                </p>
            </section>

            <!-- Result area is loaded from a reusable component for consistency across pages -->
            <div id="resultContainer"></div>

            <script type="module">
                import { loadFragment } from './js/loadFragment.js';

                (function () {
                    const regenBtn = document.getElementById("regenBtn");
                    const message = document.getElementById("message");
                    // Elements inside the result fragment will be resolved after the fragment loads
                    let indexDisplay = null;
                    let audioPlayer = null;
                    let result = null;
                    let downloadLink = null;

                    async function loadResultFragment() {
                        const frag = await loadFragment('#resultContainer', './components/result.html');
                        indexDisplay = frag.get('#indexDisplay');
                        audioPlayer = frag.get('#audioPlayer');
                        result = frag.get('#result');
                        downloadLink = frag.get('#downloadLink');
                    }

                    function toBase64(buffer) {
                        const bytes = new Uint8Array(buffer);
                        let binary = "";
                        const chunkSize = 0x8000;
                        for (let i = 0; i < bytes.length; i += chunkSize) {
                            binary += String.fromCharCode.apply(
                                null,
                                bytes.subarray(i, i + chunkSize)
                            );
                        }
                        return btoa(binary);
                    }

                    async function generateAndReconstruct() {
                        try {
                            // ensure result fragment is present
                            if (!result) {
                                await loadResultFragment();
                            }
                            result.style.display = "none";
                            message.textContent = "Generating random index...";

                            // chosen size (clamped to a reasonable maximum)
                            const select = document.getElementById("sizeSelect");
                            let size = parseInt(select.value || "262144", 10);
                            const MAX_SIZE = 60 * 1024 * 1024; // must match server MAX_INDEX_BYTES
                            if (isNaN(size) || size <= 0) size = 262144;
                            if (size > MAX_SIZE) size = MAX_SIZE;
                            const buf = new Uint8Array(size);
                            if (window.crypto && window.crypto.getRandomValues) {
                                // getRandomValues has a platform limit (65536 bytes). Fill in chunks.
                                const MAX_CRYPTO_CHUNK = 65536;
                                for (
                                    let offset = 0;
                                    offset < size;
                                    offset += MAX_CRYPTO_CHUNK
                                ) {
                                    const end = Math.min(offset + MAX_CRYPTO_CHUNK, size);
                                    const chunk = buf.subarray(offset, end);
                                    window.crypto.getRandomValues(chunk);
                                }
                            } else {
                                for (let i = 0; i < size; i++)
                                    buf[i] = Math.floor(Math.random() * 256);
                            }

                            const b64 = toBase64(buf.buffer);
                            if (indexDisplay) indexDisplay.textContent = b64;

                            message.textContent = "Sending to server for reconstruction...";
                            // Request metadata+base64 WAV
                            const resp = await fetch("/reconstruct?metadata=1", {
                                method: "POST",
                                headers: { "Content-Type": "application/json", Accept: "application/json" },
                                body: JSON.stringify({ format: "base64", data: b64 }),
                            });

                            if (!resp.ok) {
                                const text = await resp.text();
                                throw new Error(`Server error ${resp.status}: ${text}`);
                            }

                            // Try to parse JSON (metadata mode). If server returns a raw WAV, fall back.
                            const contentType = resp.headers.get('content-type') || '';
                            if (contentType.indexOf('application/json') !== -1) {
                                const j = await resp.json();
                                const meta = j.metadata || {};
                                const wavB64 = j.wavBase64;
                                if (meta) {
                                    const g = document.getElementById('metaGenre');
                                    const a = document.getElementById('metaArtist');
                                    const al = document.getElementById('metaAlbum');
                                    const t = document.getElementById('metaTrack');
                                    if (g) g.textContent = meta.genre || '';
                                    if (a) a.textContent = meta.artist || '';
                                    if (al) al.textContent = meta.album || '';
                                    if (t) t.textContent = meta.track || '';
                                    const coverImg = document.getElementById('coverImg');
                                    const metadataEl = document.getElementById('metadata');
                                    if (coverImg && meta.cover) {
                                        coverImg.src = meta.cover;
                                        if (metadataEl) metadataEl.style.display = '';
                                    } else if (coverImg && metadataEl) {
                                        coverImg.src = '';
                                        metadataEl.style.display = 'none';
                                    }
                                }
                                if (wavB64) {
                                    const bytes = atob(wavB64);
                                    const ab = new Uint8Array(bytes.length);
                                    for (let i = 0; i < bytes.length; ++i) ab[i] = bytes.charCodeAt(i);
                                    const blob = new Blob([ab], { type: 'audio/wav' });
                                    const url = URL.createObjectURL(blob);
                                    if (audioPlayer) audioPlayer.src = url;
                                    if (downloadLink) downloadLink.href = url;
                                }
                                result.style.display = '';
                                message.textContent = 'Reconstruction complete.';
                                try { audioPlayer.play().catch(() => { }); } catch (e) { }
                            } else {
                                // Legacy: server returned a blob WAV
                                const blob = await resp.blob();
                                const url = URL.createObjectURL(blob);
                                if (audioPlayer) audioPlayer.src = url;
                                if (downloadLink) downloadLink.href = url;
                                result.style.display = '';
                                message.textContent = 'Reconstruction complete.';
                                try { audioPlayer.play().catch(() => { }); } catch (e) { }
                            }
                        } catch (err) {
                            message.textContent = "Error: " + String(err.message || err);
                            console.error(err);
                        }
                    }

                    regenBtn.addEventListener("click", (e) => {
                        e.preventDefault();
                        generateAndReconstruct();
                    });

                    // generate automatically on page load (ensure fragment loaded first)
                    window.addEventListener("DOMContentLoaded", async () => {
                        try {
                            await loadResultFragment();
                        } catch (e) {
                            // loading failed; still attempt generation which will retry loading
                        }
                        generateAndReconstruct();
                    });
                })();
            </script>
        </main>
    </div>
</body>

</html>
