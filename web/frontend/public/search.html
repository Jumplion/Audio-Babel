<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Search — Audibel</title>
  <link rel="stylesheet" href="./css/site.css" />
</head>

<body class="light">
  <div class="wrap">
    <main class="card light">
      <h1>Search</h1>
      <p>Search by an index string or upload a .wav file to extract its index.</p>
      <p><a class="btn" href="./index.html">Back to Home</a></p>

      <div id="searchControls" style="margin-top:16px">
        <div style="margin-bottom:8px">
          <button class="btn" id="tabIndex">Search by Index</button>
          <button class="btn" id="tabFile">Search by File</button>
        </div>

        <div id="panelIndex" style="display:none">
          <label for="indexInput">Index (letters, numbers, - and _ only):</label>
          <input id="indexInput" type="text" style="width: 100%; padding:8px; margin-top:6px" />
          <div style="margin-top:8px">
            <button class="btn" id="doIndexSearch">Search</button>
          </div>
        </div>

        <div id="panelFile" style="display:none">
          <label for="fileInput">Select a .wav file to upload:</label>
          <input id="fileInput" type="file" accept="audio/wav,audio/x-wav,.wav" style="display:block;margin-top:6px" />
          <div style="margin-top:8px">
            <button class="btn" id="doFileSearch">Upload & Extract</button>
          </div>
          <p style="margin-top:8px"><small>The server will extract the index from the uploaded WAV and return the index,
              metadata, cover art, and reconstructed WAV.</small></p>
        </div>
      </div>

      <!-- shared result area -->
      <div id="resultContainer"></div>

      <script type="module">
        import { loadFragment } from './js/loadFragment.js';

        const tabIndex = document.getElementById('tabIndex');
        const tabFile = document.getElementById('tabFile');
        const panelIndex = document.getElementById('panelIndex');
        const panelFile = document.getElementById('panelFile');
        const indexInput = document.getElementById('indexInput');
        const fileInput = document.getElementById('fileInput');
        const doIndexSearch = document.getElementById('doIndexSearch');
        const doFileSearch = document.getElementById('doFileSearch');

        let resultFrag = null;

        function showIndex() {
          panelIndex.style.display = '';
          panelFile.style.display = 'none';
        }

        function showFile() {
          panelIndex.style.display = 'none';
          panelFile.style.display = '';
        }

        tabIndex.addEventListener('click', showIndex);
        tabFile.addEventListener('click', showFile);

        // sanitize input: allow only letters, digits, - and _
        indexInput.addEventListener('input', (e) => {
          const cleaned = indexInput.value.replace(/[^A-Za-z0-9_-]/g, '');
          if (cleaned !== indexInput.value) {
            const pos = indexInput.selectionStart - (indexInput.value.length - cleaned.length);
            indexInput.value = cleaned;
            indexInput.setSelectionRange(pos, pos);
          }
        });

        async function ensureResultFrag() {
          if (!resultFrag) {
            resultFrag = await loadFragment('#resultContainer', './components/result.html');
          }
          return resultFrag;
        }

        // Search by index: display the index in the shared component and call server if needed
        doIndexSearch.addEventListener('click', async () => {
          const idx = indexInput.value.trim();
          if (!idx) return alert('Please enter an index string');
          const frag = await ensureResultFrag();
          const indexDisplay = frag.get('#indexDisplay');
          const resultEl = frag.get('#result');
          if (indexDisplay) indexDisplay.textContent = idx;
          if (resultEl) resultEl.style.display = '';
          // TODO: call server endpoint to search by index and display metadata / audio
        });

        // Search by file: upload WAV to server endpoint `/search_by_file` (to be implemented server-side)
        doFileSearch.addEventListener('click', async () => {
          const file = fileInput.files && fileInput.files[0];
          if (!file) return alert('Please select a .wav file first');
          const form = new FormData();
          form.append('file', file, file.name);
          try {
            const resp = await fetch('/search_by_file', { method: 'POST', body: form });
            if (!resp.ok) {
              const txt = await resp.text();
              return alert('Server error: ' + resp.status + '\n' + txt);
            }
            // Expecting JSON with { indexBase64, metadata, wavBase64 }
            const j = await resp.json();
            const frag = await ensureResultFrag();
            const indexDisplay = frag.get('#indexDisplay');
            const resultEl = frag.get('#result');
            if (indexDisplay && j.indexBase64) indexDisplay.textContent = j.indexBase64;
            // populate metadata and cover
            if (j.metadata) {
              const g = frag.get('#metaGenre');
              const a = frag.get('#metaArtist');
              const al = frag.get('#metaAlbum');
              const t = frag.get('#metaTrack');
              if (g) g.textContent = j.metadata.genre || '';
              if (a) a.textContent = j.metadata.artist || '';
              if (al) al.textContent = j.metadata.album || '';
              if (t) t.textContent = j.metadata.track || '';
              const cover = frag.get('#coverImg');
              const metadataEl = frag.get('#metadata');
              if (cover && j.metadata.cover) {
                cover.src = j.metadata.cover;
                if (metadataEl) metadataEl.style.display = '';
              } else if (cover && metadataEl) {
                cover.src = '';
                metadataEl.style.display = 'none';
              }
            }
            // decode wavBase64 if present
            if (j.wavBase64) {
              const bytes = atob(j.wavBase64);
              const ab = new Uint8Array(bytes.length);
              for (let i = 0; i < bytes.length; ++i) ab[i] = bytes.charCodeAt(i);
              const blob = new Blob([ab], { type: 'audio/wav' });
              const url = URL.createObjectURL(blob);
              const audioPlayer = frag.get('#audioPlayer');
              const downloadLink = frag.get('#downloadLink');
              if (audioPlayer) audioPlayer.src = url;
              if (downloadLink) downloadLink.href = url;
            }
            if (resultEl) resultEl.style.display = '';
          } catch (err) {
            console.error(err);
            alert('Upload failed: ' + String(err));
          }
        });

        // Default to Index tab
        showIndex();
      </script>
    </main>
  </div>
</body>

</html>
