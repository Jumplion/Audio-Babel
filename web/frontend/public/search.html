<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Audibel — Search Index</title>
    <link rel="stylesheet" href="./css/site.css" />
    <link rel="stylesheet" href="./css/resultHandler.css" />
</head>

<body class="search">
    <div id="navContainer"></div>

    <div class="wrap">
        <main class="card">
            <h1>Search Index</h1>
            <div style="margin-bottom:12px">
                <label for="searchInput">Enter an index string (A-Z, a-z, 0-9, - and _):</label>
                <textarea id="searchInput" rows="1"
                    style="display: block; margin-top: 6px; width: 100%; overflow: hidden; resize: none;"
                    placeholder="Type index here..."></textarea>
                <div style="margin-top: 8px">
                    <button class="btn" id="doSearchGenerate" disabled>Generate from index</button>
                </div>
                <p style="margin-top: 8px">
                    <small>Only characters A-Z a-z 0-9 - and _ are allowed. The string will be used directly as the
                        index
                        bytes.</small>
                </p>
            </div>

            <div id="statusLine" style="margin-bottom:8px; display:flex; align-items:center; gap:8px;">
                <span id="statusMsg">Ready</span><span id="statusSpinner" style="display: none" class="spinner"></span>
            </div>
            <div id="resultContainer"></div>

            <footer>
                <small>Search an index string and reconstruct audio.</small>
            </footer>
        </main>
    </div>

    <script type="module" src="./js/main.js?v=4"></script>
    <script type="module">
        import { loadFragment } from './js/loadFragment.js';
        import { highlightActiveNav } from './js/nav.js';
        (async () => { await loadFragment('#navContainer', './components/navbar.html'); highlightActiveNav('#navContainer'); })();
    </script>

</body>

</html>
